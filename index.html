<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ruang Baca</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
  </head>
  <body>

    <nav class="navbar navbar-expand-lg navbar-dark bg-success">
      <div class="container-fluid">
        <a class="navbar-brand" href="#">Ruang Baca</a>

        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#navbarNav"
        >
          <span class="navbar-toggler-icon"></span>
        </button>


        <div
          class="collapse navbar-collapse justify-content-end"
          id="navbarNav"
        >
          <ul class="navbar-nav">
            <li class="nav-item">
              <a class="nav-link text-white" href="#">Beranda</a>
            </li>
            <li class="nav-item">
              <a class="nav-link text-white" href="#">Tentang</a>
            </li>
            <li class="nav-item">
              <a class="nav-link text-white" href="#">Bantuan</a>
            </li>
          </ul>
        </div>
      </div>
    </nav>


    <div
      class="container-fluid d-flex justify-content-center align-items-center"
      style="min-height: 90vh"
    >
      <div class="row w-100 justify-content-center">
        <div class="col-lg-4 col-md-6 col-sm-10">
          <div class="card shadow p-4">
            <h4 class="text-center fw-bold mb-3">Masuk ke Ruang Baca</h4>
            <p class="text-center text-muted mb-4">
              Temukan bacaan untuk hari ini.
            </p>

            <form>
              <div class="mb-4">
                <label for="username" class="form-label">Username</label>
                <input
                  type="text"
                  class="form-control"
                  id="username"
                  placeholder="Masukkan username"
                />
              </div>

              <div class="mb-4">
                <label for="password" class="form-label">Password</label>
                <input
                  type="password"
                  class="form-control"
                  id="password"
                  placeholder="Masukkan password"
                />
              </div>

              <div class="form-check mb-4">
                <input
                  class="form-check-input"
                  type="checkbox"
                  id="ingatSaya"
                />
                <label class="form-check-label" for="ingatSaya"
                  >Ingat saya</label
                >
              </div>

              <button type="submit" class="btn btn-success w-100 mb-3">
                Masuk
              </button>
            </form>

            <hr class="my-3" />
            <div class="text-center">
              <a href="#" class="text-success text-decoration-none"
                >Lupa password?</a
              >
            </div>
          </div>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
